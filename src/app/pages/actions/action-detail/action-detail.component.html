@if (action()?.type) {
<ng-container *ngTemplateOutlet="templates[action()!.type!]"> </ng-container>
}

<ng-template #wait>
  <app-wait-for-detail [action]="action()!"></app-wait-for-detail>
</ng-template>

<ng-template #schedule>
  <app-schedule-detail [action]="action()!"> </app-schedule-detail>
</ng-template>
